hostname: R2

interfaces:
  - name: Ethernet0/1
    description: Link to R1 (OSPF)
    ip: 10.0.12.2
    mask: 255.255.255.252

  - name: Loopback0
    description: Remote site network
    ip: 192.168.30.1
    mask: 255.255.255.0

ospf:
  process: 1
  router_id: 2.2.2.2
  networks:
    - { net: 10.0.12.0,    wildcard: 0.0.0.3,   area: 0 }
    - { net: 192.168.30.0, wildcard: 0.0.0.255, area: 0 }