hostname: R1

interfaces:
  - name: Ethernet0/1
    description: Link to R2 (OSPF)
    ip: 10.0.12.1
    mask: 255.255.255.252

  - name: Ethernet0/2
    description: Trunk to SW1
    subinterfaces:
      - name: Ethernet0/2.10
        vlan: 10
        description: Gateway VLAN 10 USERS
        ip: 192.168.10.1
        mask: 255.255.255.0
      - name: Ethernet0/2.20
        vlan: 20
        description: Gateway VLAN 20 SERVERS
        ip: 192.168.20.1
        mask: 255.255.255.0

ospf:
  process: 1
  router_id: 1.1.1.1
  networks:
    - { net: 10.0.12.0,    wildcard: 0.0.0.3,   area: 0 }
    - { net: 192.168.10.0, wildcard: 0.0.0.255, area: 0 }
    - { net: 192.168.20.0, wildcard: 0.0.0.255, area: 0 }
  passive_interfaces:
    - Ethernet0/2.10
    - Ethernet0/2.20

acls:
  - name: WAN_IN
    apply_on: Ethernet0/1
    direction: in
    rules:
      - { seq: 10, action: deny,   proto: tcp, src: any, dst: 192.168.10.0 0.0.0.255, port: 22 }
      - { seq: 20, action: deny,   proto: tcp, src: any, dst: 192.168.20.0 0.0.0.255, port: 22 }
      - { seq: 100, action: permit, proto: ip, src: any, dst: any }